server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: magic-club

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/magic_club?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000

  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB
      file-size-threshold: 20KB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# MyBatis Plus
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id
  mapper-locations: classpath*:/mapper/**/*.xml

# JWT配置
jwt:
  secret: bWFnaWNDbHViU2VjcmV0S2V5MjAyNE1hZ2ljQ2x1YlNlY3JldEtleTIwMjQ=  # Base64编码的密钥
  expiration: 86400000  # 24小时

# 文件上传配置
file:
  upload:
    path: C:/uploads/
    allowed-types: jpg,jpeg,png,gif,bmp,mp4,avi,mov,wmv,doc,docx,pdf,txt,ppt,pptx,xls,xlsx,zip,rar
    max-size: 524288000  # 500MB

# 日志
logging:
  level:
    cn.magicclub: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
